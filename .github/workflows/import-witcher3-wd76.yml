name: Import Witcher WD0-WD76 Dataset

on:
  push:
    branches:
      - feature/witcher3-wd0-wd76

permissions:
  contents: write

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/witcher3-wd0-wd76
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download corrected sanitized dataset
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-c350-81f4-b73d-f4ea1e2a9723/raw?se=2026-08-26T20%3A33%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=203ae63e-ea65-5d29-850d-d0de60709511&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-26T19%3A04%3A08Z&ske=2026-08-27T19%3A04%3A08Z&sks=b&skv=2026-02-06&sig=GvIa/yaZT9y813tw0H7RTOHxsvowC3vXblWhvcXtmnE%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ARTIFACT_URL" -o /tmp/witcher3-observatory.zip
          rm -rf data/witcher3
          mkdir -p data/witcher3
          unzip -q /tmp/witcher3-observatory.zip -d data/witcher3
          test "$(find data/witcher3 -maxdepth 1 -name 'wd-*.json' | wc -l)" -eq 77

      - name: Validate Observatory dataset
        run: |
          python3 scripts/validate_data.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/witcher3')
          load = lambda d: json.loads((root / f'wd-{d:03d}.json').read_text())
          ids = lambda d: [x['id'] for x in load(d)['actual_past']]
          assert 'history:q501_crach_dies' in ids(68)
          assert 'history:q501_eredin_died' in ids(69)
          assert 'history:q502_ciri_survives' in ids(69)
          assert 'history:q705_ciri_empress' in ids(70)
          assert load(70)['phase'] == 'IMPORTED ACTUAL HISTORY'
          assert load(71)['phase'] == 'LIVING WORLD POSTGAME'
          assert json.loads((root / 'manifest.json').read_text())['snapshots'][-1]['world_day'] == 76
          print('WD0-WD76 import smoke check OK')
          PY

      - name: Commit corrected dataset
        run: |
          set -euo pipefail
          git config user.name 'TwistyRoads'
          git config user.email 'kristiansenjf@proton.me'
          git add data/witcher3
          if git diff --cached --quiet; then
            echo 'No dataset changes to commit.'
            exit 0
          fi
          git commit -m 'Replace Witcher dataset with corrected WD0-WD76 replay'
          git push origin HEAD:feature/witcher3-wd0-wd76
