name: Validate Observatory

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public data contract
        run: python3 scripts/validate_data.py
      - name: Compile validator
        run: python3 -m py_compile scripts/validate_data.py
