<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Living World Observatory — inspect world state, knowledge propagation, causal traces, and next-horizon frontiers.">
  <title>Living World Observatory</title>
  <link rel="stylesheet" href="css/observatory.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">LIVING WORLD</p>
      <h1>Observatory</h1>
      <p id="world-description" class="subtitle">Loading presentation-safe world data…</p>
    </div>
    <div class="status-block" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="dataset-status">Loading</span>
    </div>
  </header>

  <main>
    <section class="timeline-shell" aria-labelledby="timeline-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">WORLD CLOCK</p>
          <h2 id="timeline-title">Historical position</h2>
        </div>
        <div class="day-readout">
          <span id="day-label">WD —</span>
          <span id="date-label">—</span>
        </div>
      </div>

      <div class="timeline-controls">
        <button id="previous-day" type="button" aria-label="Previous World Day">←</button>
        <input id="day-slider" type="range" min="0" max="0" value="0" step="1" aria-label="World Day">
        <button id="next-day" type="button" aria-label="Next World Day">→</button>
      </div>
      <div id="timeline-markers" class="timeline-markers" aria-hidden="true"></div>
    </section>

    <section class="hero-panel" aria-live="polite">
      <p id="phase-label" class="phase-label">—</p>
      <h2 id="headline">Loading snapshot…</h2>
      <p id="summary" class="hero-summary"></p>
    </section>

    <nav class="mode-tabs" aria-label="Observatory mode">
      <button class="mode-tab is-active" data-mode="world" type="button">World</button>
      <button class="mode-tab" data-mode="knowledge" type="button">Knowledge</button>
      <button class="mode-tab" data-mode="frontier" type="button">Frontier</button>
      <button class="mode-tab" data-mode="trace" type="button">Why</button>
    </nav>

    <section id="mode-content" class="mode-content" aria-live="polite"></section>
  </main>

  <footer>
    <p>The engine owns causality. The Observatory explains it.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
